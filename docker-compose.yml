version: '3.8'

services:
  # ============================================================================
  # Broker de Mensajería: RabbitMQ con consola de gestión (Management UI)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bonbin-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # Puerto AMQP para comunicación de microservicios
      - "15672:15672"   # Consola Web de Administración (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bonbin-network

  # ============================================================================
  # Microservicio Administrador de RabbitMQ (Indicadores 6, 7 y 8)
  # ============================================================================
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: bonbin-admin-service
    restart: always
    ports:
      - "8084:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - bonbin-network

  # ============================================================================
  # Microservicio Catálogo y Stock (Consumidor RabbitMQ con ACK manual y DLQ)
  # ============================================================================
  producto-service:
    build:
      context: ./producto-service
      dockerfile: Dockerfile
    container_name: bonbin-producto-service
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      API_AUDIENCE: ${API_AUDIENCE}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - bonbin-network

  # ============================================================================
  # Microservicio Usuarios y Perfiles
  # ============================================================================
  usuario-service:
    build:
      context: ./usuario-service
      dockerfile: Dockerfile
    container_name: bonbin-usuario-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      API_AUDIENCE: ${API_AUDIENCE}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - bonbin-network

  # ============================================================================
  # Microservicio Pedidos y Carrito (Productor de eventos RabbitMQ)
  # ============================================================================
  pedido-service:
    build:
      context: ./pedido-service
      dockerfile: Dockerfile
    container_name: bonbin-pedido-service
    restart: always
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      producto-service:
        condition: service_started
    environment:
      DB_HOST: ${DB_HOST}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCTO_SERVICE_URL: http://producto-service:8081
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - bonbin-network

  # ============================================================================
  # BFF (Backend for Frontend)
  # ============================================================================
  bff-service:
    build:
      context: ./bff-service
      dockerfile: Dockerfile
    container_name: bonbin-bff-service
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - producto-service
      - usuario-service
      - pedido-service
      - admin-service
    environment:
      PRODUCTO_SERVICE_URL: http://producto-service:8081
      USUARIO_SERVICE_URL: http://usuario-service:8082
      PEDIDO_SERVICE_URL: http://pedido-service:8083
      ADMIN_SERVICE_URL: http://admin-service:8084
      COGNITO_ISSUER: ${COGNITO_ISSUER}
      API_AUDIENCE: ${API_AUDIENCE}
    networks:
      - bonbin-network

volumes:
  rabbitmq_data:
    driver: local

networks:
  bonbin-network:
    driver: bridge
