server:
  port: 8083

spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/pedido_service
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true

# ==============================================================================
# CONFIGURACIÓN CENTRALIZADA DE TÓPICOS KAFKA (Indicadores 1, 2 y 7)
# ==============================================================================
kafka:
  topics:
    pedido-pagado: pedido.pagado.topic
    pedido-cancelado: pedido.cancelado.topic
    partitions: 3
    replication-factor: 1
    retention-ms: 604800000 # 7 días de retención
    cleanup-policy: delete

producto-service:
  url: ${PRODUCTO_SERVICE_URL:http://localhost:8081}

# ==============================================================================
# INDICADOR 1: Configuración centralizada de RabbitMQ para Peluchitos Bonbin
# Nombres de exchanges, colas y routing keys centralizados para todos los microservicios
# ==============================================================================
rabbitmq:
  exchange:
    name: peluchitos.exchange
    dlx: peluchitos.dlx
  queues:
    pedido-pagado: pedido.pagado.queue
    pedido-pagado-dlq: pedido.pagado.dlq
    pedido-cancelado: pedido.cancelado.queue
    pedido-cancelado-dlq: pedido.cancelado.dlq
  routing-keys:
    pedido-pagado: pedido.pagado.key
    pedido-pagado-dlq: pedido.pagado.dlq.key
    pedido-cancelado: pedido.cancelado.key
    pedido-cancelado-dlq: pedido.cancelado.dlq.key
