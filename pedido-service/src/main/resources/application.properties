spring.application.name=pedido-service
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/pedido_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

producto-service.url=http://localhost:8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}