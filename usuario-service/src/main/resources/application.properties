spring.application.name=usuario-service
server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/usuario_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${API_AUDIENCE}
cognito.userinfo-uri=https://us-east-1f7srefcco.auth.us-east-1.amazoncognito.com/oauth2/userInfo