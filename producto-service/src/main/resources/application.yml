server:
  port: 8081

spring:
  application:
    name: producto-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/producto_service
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER}
          audiences: ${API_AUDIENCE}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual # Indicador 5: Modo manual para gestión explícita de ACK / NACK
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventario-group # Indicador 8: Consumer group para balanceo y resiliencia
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual_immediate

# ==============================================================================
# CONFIGURACIÓN CENTRALIZADA DE TÓPICOS KAFKA (Indicadores 1, 2 y 8)
# ==============================================================================
kafka:
  topics:
    pedido-pagado: pedido.pagado.topic
    pedido-cancelado: pedido.cancelado.topic

# ==============================================================================
# INDICADOR 1: Configuración centralizada de RabbitMQ para Peluchitos Bonbin
# Nombres de exchanges, colas y routing keys centralizados para todos los microservicios
# ==============================================================================
rabbitmq:
  exchange:
    name: peluchitos.exchange
    dlx: peluchitos.dlx
  queues:
    pedido-pagado: pedido.pagado.queue
    pedido-pagado-dlq: pedido.pagado.dlq
    pedido-cancelado: pedido.cancelado.queue
    pedido-cancelado-dlq: pedido.cancelado.dlq
  routing-keys:
    pedido-pagado: pedido.pagado.key
    pedido-pagado-dlq: pedido.pagado.dlq.key
    pedido-cancelado: pedido.cancelado.key
    pedido-cancelado-dlq: pedido.cancelado.dlq.key
